<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Cancha Vibratto</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a2e1a 0%, #1a5c32 50%, #0a2e1a 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 15px;
    }
    .container { width: 100%; max-width: 580px; }
    .header { text-align: center; margin-bottom: 24px; }
    .header .logo { font-size: 52px; margin-bottom: 8px; }
    .header h1 { color: #ffffff; font-size: 26px; font-weight: 700; }
    .header p { color: #a8d5b5; font-size: 13px; margin-top: 4px; }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 16px;
    }
    .card-title { color: #a8d5b5; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
    .tab {
      padding: 12px; border-radius: 12px; text-align: center;
      font-size: 13px; font-weight: 600; font-family: 'Poppins', sans-serif;
      cursor: pointer; border: 2px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.5); background: transparent; transition: all 0.2s;
    }
    .tab.activo { background: #4ade80; color: #0a2e1a; border-color: #4ade80; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; color: #a8d5b5; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
    .input-group input, .input-group select {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; color: white; font-size: 14px;
      font-family: 'Poppins', sans-serif; outline: none; transition: border 0.2s;
    }
    .input-group select option { background: #1a5c32; color: white; }
    .input-group input::placeholder { color: rgba(255,255,255,0.35); }
    .input-group input:focus, .input-group select:focus { border-color: #4ade80; }
    .dos-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #0a2e1a; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; font-family: 'Poppins', sans-serif;
      cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74,222,128,0.4); }
    .mensaje { padding: 14px; border-radius: 12px; text-align: center; font-weight: 600; font-size: 14px; display: none; margin-top: 12px; }
    .exito { background: rgba(74,222,128,0.2); color: #4ade80; border: 1px solid rgba(74,222,128,0.4); }
    .error { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">⚽</div>
    <h1>Reserva de Cancha</h1>
<p>Club House Sotavento · Registra tu reserva</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab activo" onclick="mostrarTab('login')">Ya estoy registrado</button>
      <button class="tab" onclick="mostrarTab('registro')">Registrarme</button>
    </div>

    <!-- LOGIN -->
<div id="tab-login">
  <div class="card-title">🔑 Iniciar sesión</div>
  <div class="input-group">
    <label>Número de cédula</label>
    <input type="text" id="login-cedula" placeholder="Ej: 1234567890">
  </div>
  <div class="input-group">
    <label>Conjunto residencial</label>
    <select id="login-conjunto">
      <option value="">Selecciona el conjunto</option>
      <option value="Arena">Arena</option>
      <option value="Vibratto">Vibratto</option>
    </select>
  </div>
  <div class="dos-columnas">
    <div class="input-group">
      <label>Torre</label>
      <input type="text" id="login-torre" placeholder="Ej: 5">
    </div>
    <div class="input-group">
      <label>Apartamento</label>
      <input type="text" id="login-apartamento" placeholder="Ej: 301">
    </div>
  </div>
  <button class="btn" onclick="iniciarSesion()">Entrar a reservar</button>
  <div class="mensaje" id="mensaje-login"></div>
</div>
    </div>

    <!-- REGISTRO -->
    <div id="tab-registro" style="display:none;">
      <div class="card-title">👤 Nuevo registro</div>
      <div class="input-group">
        <label>Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
      </div>
      <div class="input-group">
        <label>Número de cédula</label>
        <input type="text" id="cedula" placeholder="Ej: 1234567890">
      </div>
      <div class="input-group">
        <label>Conjunto residencial</label>
        <select id="conjunto">
          <option value="">Selecciona el conjunto</option>
          <option value="Arena">Arena</option>
          <option value="Vibratto">Vibratto</option>
        </select>
      </div>
      <div class="dos-columnas">
        <div class="input-group">
          <label>Torre</label>
          <input type="text" id="torre" placeholder="Ej: 5">
        </div>
        <div class="input-group">
          <label>Apartamento</label>
          <input type="text" id="apartamento" placeholder="Ej: 301">
        </div>
      </div>
      <button class="btn" onclick="registrar()">Registrarme</button>
      <div class="mensaje" id="mensaje-registro"></div>
    </div>
  </div>
</div>

<script>
  const API = 'https://reservas-cancha-1-1ky2.onrender.com';

  function mostrarTab(tab) {
    document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('tab-registro').style.display = tab === 'registro' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('activo', (tab === 'login' && i === 0) || (tab === 'registro' && i === 1));
    });
  }

  async function iniciarSesion() {
    const cedula = document.getElementById('login-cedula').value.trim();
    const conjunto = document.getElementById('login-conjunto').value;
    const torre = document.getElementById('login-torre').value.trim();
    const apartamento = document.getElementById('login-apartamento').value.trim();

    if (!cedula || !conjunto || !torre || !apartamento) {
      mostrarMensaje('mensaje-login', 'Por favor completa todos los campos', 'error');
      return;
    }

    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cedula, conjunto, torre, apartamento })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('residente', JSON.stringify(data.residente));
      mostrarMensaje('mensaje-login', '✅ Bienvenido ' + data.residente.nombre, 'exito');
      setTimeout(() => window.location.href = 'index.html', 1500);
    } else {
      mostrarMensaje('mensaje-login', '❌ ' + data.error, 'error');
    }
  }
  
  async function registrar() {
    const nombre = document.getElementById('nombre').value.trim();
    const cedula = document.getElementById('cedula').value.trim();
    const conjunto = document.getElementById('conjunto').value;
    const torre = document.getElementById('torre').value.trim();
    const apartamento = document.getElementById('apartamento').value.trim();

    if (!nombre || !cedula || !conjunto || !torre || !apartamento) {
      mostrarMensaje('mensaje-registro', 'Por favor completa todos los campos', 'error');
      return;
    }

    const res = await fetch(`${API}/residentes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, cedula, conjunto, torre, apartamento })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('residente', JSON.stringify({ nombre, cedula, conjunto, torre, apartamento }));
      mostrarMensaje('mensaje-registro', '✅ Registro exitoso! Redirigiendo...', 'exito');
      setTimeout(() => window.location.href = 'index.html', 1500);
    } else {
      mostrarMensaje('mensaje-registro', '❌ ' + data.error, 'error');
    }
  }

  function mostrarMensaje(id, texto, tipo) {
    const m = document.getElementById(id);
    m.textContent = texto;
    m.className = 'mensaje ' + tipo;
    m.style.display = 'block';
  }
</script>
</body>
</html>
